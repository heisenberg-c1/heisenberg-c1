name: generate snake animation

on:
  # 每 2 小时自动跑一次
  schedule:
    - cron: "0 */2 * * *"

  # 支持在 Actions 页面手动触发（首次务必手动跑一次）
  workflow_dispatch:

  # 每次推送到 main 分支时也跑一次
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 从你的贡献图生成贪吃蛇动画，输出两个 SVG（浅色 / 深色）
      # color_dots 必须正好 5 个颜色：第 1 个是「0 贡献」的格子，之后由低到高
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563EB&color_dots=#EBEDF0,#DBEAFE,#BFDBFE,#93C5FD,#2563EB
            dist/github-contribution-grid-snake-dark.svg?color_snake=#60A5FA&color_dots=#161B22,#1E3A5F,#1D4ED8,#3B82F6,#93C5FD

      # 把生成的 SVG 推到 output 分支
      # 最终地址：https://raw.githubusercontent.com/<user>/<repo>/output/<file>.svg
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
